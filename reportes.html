<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080c18">
<title>ING · Reportes de Servicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c18;--s1:rgba(255,255,255,.04);--s2:rgba(255,255,255,.07);--bd:rgba(255,255,255,.09);--txt:#f1f4fb;--mut:#8e9ab3;--dim:#5d6882;--gold:#f2c46d;--ok:#22d3a0;--late:#fbbf24;--red:#ff5d6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--txt);font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;background:var(--bg)}
body{min-height:100vh;padding-bottom:40px;background:radial-gradient(900px 500px at 110% -10%,rgba(242,196,109,.12),transparent 60%),radial-gradient(800px 600px at -20% 10%,rgba(34,211,160,.08),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select{font-family:inherit}
.wrap{max-width:900px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 0}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header .tx{flex:1}
header small{display:block;font-size:10.5px;letter-spacing:.18em;color:var(--gold);font-weight:800}
header h1{margin:2px 0 0;font-size:21px;font-weight:800}
.back{color:var(--mut);text-decoration:none;font-size:13px;font-weight:700;border:1px solid var(--bd);padding:8px 12px;border-radius:12px;background:var(--s1)}
.card{border-radius:22px;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--bd);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:15px;font-weight:800}
.modes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.modes::-webkit-scrollbar{display:none}
.mode{flex:none;padding:9px 13px;border-radius:99px;border:1px solid var(--bd);background:var(--s1);color:var(--mut);font-size:13px;font-weight:800;cursor:pointer}
.mode.on{background:var(--gold);color:#1b1406;border-color:var(--gold)}
.inputs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:flex-end}
.inputs label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--mut);flex:1;min-width:130px}
input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);color:var(--txt);font-weight:700;font-size:16px;border-radius:12px;padding:12px;color-scheme:dark}
.range{margin-top:10px;font-size:13px;color:var(--gold);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:14px;border-radius:18px;background:rgba(0,0,0,.2);border:1px solid var(--bd)}
.kpi b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:12px;font-weight:700;color:var(--mut)}
.kpi small{display:block;font-size:11.5px;color:var(--dim);font-weight:600;margin-top:2px}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08);margin:6px 0 10px}
.split i{display:block;height:100%}
.leg{display:flex;gap:16px;font-size:12.5px;font-weight:700;color:var(--mut);flex-wrap:wrap}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border-bottom:0}
.row .n{flex:1;font-weight:600;line-height:1.3}
.row .v{font-weight:800;white-space:nowrap}
.row .sub{display:block;font-size:12px;color:var(--mut);font-weight:600}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.inf{border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-top:8px;background:rgba(0,0,0,.18);cursor:pointer}
.inf .h{display:flex;align-items:center;gap:10px}
.inf .d{flex:1}
.inf .d b{display:block;font-size:14.5px}
.inf .d span{font-size:12.5px;color:var(--mut);font-weight:600}
.badge{font-size:13px;font-weight:800;padding:6px 10px;border-radius:12px}
.inf .det{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--bd);font-size:13.5px;line-height:1.5}
.inf.open .det{display:block}
.det h4{margin:10px 0 4px;font-size:12px;letter-spacing:.06em;color:var(--mut)}
.det .del{margin-top:12px;background:none;border:1px solid rgba(255,93,108,.5);color:var(--red);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:14.5px;cursor:pointer;background:var(--gold);color:#1b1406}
.btn.ghost{background:var(--s2);color:var(--txt);border:1px solid var(--bd)}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-weight:600}
.lock{max-width:380px;margin:12vh auto 0;text-align:center}
.lock .ic{font-size:46px}
.lock input{text-align:center;font-size:26px;letter-spacing:.4em;margin:16px 0 10px}
.err{color:var(--red);font-weight:700;font-size:13.5px;min-height:20px}
.load{opacity:.5;pointer-events:none}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:50;width:min(92vw,420px);padding:13px 16px;border-radius:16px;font-weight:700;font-size:14px;text-align:center;color:#fff;background:rgba(22,163,74,.95);transition:transform .35s}
.toast.show{transform:translate(-50%,0)}.toast.bad{background:rgba(220,50,70,.95)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:100%;max-width:520px;background:#121a2d;border:1px solid var(--bd);border-radius:26px 26px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px}.sheet p{margin:0 0 16px;color:var(--mut);font-size:14px}
.sheet button{width:100%;padding:15px;border-radius:14px;font-size:15px;font-weight:800;margin-top:8px;border:1px solid var(--bd);background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer}
.sheet .danger{background:var(--red);border-color:var(--red);color:#fff}
.hero{padding:20px}
.hl{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--mut)}
.hrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:6px}
.big{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1}.big span{font-size:30px}
.hs{flex:1;min-width:220px}.hs>b{font-size:15px}
.dl{display:block;font-size:12px;font-weight:700;margin-top:4px}.dl.good{color:var(--ok)}.dl.bad{color:var(--red)}.dl.neutral{color:var(--dim)}
.kpi{display:flex;flex-direction:column;gap:2px}.kpi span{order:-1}.kpi b em{font-size:15px;font-style:normal;color:var(--mut)}
.kpi .sub{font-size:11.5px;color:var(--dim);font-weight:600}
.kpis{margin-bottom:14px}
.cap{margin:-6px 0 12px;font-size:12.5px;color:var(--mut);font-weight:600}
.ax{fill:#8e9ab3;font-size:10.5px;font-weight:700;font-family:inherit}
.stack{display:flex;height:16px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:8px}
.stack i{display:block;height:100%}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
.pc{color:var(--mut);font-weight:700;font-size:12px;margin-left:4px}
.row .sub.g{color:var(--ok)}.row .sub.r{color:var(--red)}
.rk{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--mut);flex:none}
.hi{display:grid;grid-template-columns:1fr;gap:8px}@media(min-width:700px){.hi{grid-template-columns:repeat(3,1fr)}}
.hi div{padding:14px;border-radius:16px;background:rgba(0,0,0,.2);border:1px solid var(--bd)}
.hi span{display:block;font-size:12.5px;font-weight:700;color:var(--mut)}.hi b{display:block;font-size:24px;font-weight:800;margin:4px 0}.hi small{color:var(--dim);font-weight:600;font-size:12px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;color:var(--mut);font-size:11.5px;font-weight:800;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:11px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}tr:last-child td{border-bottom:0}
.badge{background:rgba(255,255,255,.06)}
.acts{display:flex;gap:8px;flex:none}
.tip{position:fixed;z-index:70;pointer-events:none;opacity:0;transition:opacity .12s;background:#1c2540;border:1px solid rgba(255,255,255,.15);color:var(--txt);font-size:12.5px;line-height:1.45;padding:9px 11px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:260px}
@media print{body{background:#fff;color:#111}.card,.kpi,.hi div,.inf{background:#fff!important;border-color:#ddd!important;break-inside:avoid}.modes,.inputs,.back,.del,.toast,.tip{display:none!important}header h1,h2,b,td{color:#111}.ax{fill:#555}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet"><h3>¿Eliminar este informe?</h3><p id="mTxt"></p><button class="danger" id="mYes">Sí, eliminar</button><button id="mNo">Cancelar</button></div></div>

<div id="lock" class="wrap"><div class="lock">
  <div class="ic">🔒</div><h1 style="margin:10px 0 4px;font-size:22px">Reportes de Servicio</h1>
  <p style="color:var(--mut);margin:0">Ingresa el PIN para ver los informes</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••">
  <div class="err" id="pinErr"></div>
  <button class="btn" id="pinGo" style="width:100%">Entrar</button>
  <p style="margin-top:18px"><a href="/" style="color:var(--gold);font-weight:700;text-decoration:none">← Volver al formulario</a></p>
</div></div>

<div id="main" class="wrap" style="display:none">
  <header><div class="tx"><small>IGLESIA NUEVA GENERACIÓN</small><h1>Reportes de Servicio</h1></div><a class="back" href="/">← Formulario</a></header>

  <div class="card">
    <div class="modes" id="modes"></div>
    <div class="inputs" id="inputs"></div>
    <div class="range" id="range"></div>
  </div>

  <div id="out"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const PKEY='ing_rep_pin';
let PIN='';try{PIN=localStorage.getItem(PKEY)||''}catch(e){}
let DATA=[],delId=null;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=new Date(),Y=now.getFullYear(),M=now.getMonth();
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=s=>{const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d).toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)};
const lastDay=(y,m)=>new Date(y,m+1,0).getDate();
let toastT;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',2800)}

/* ---------- Períodos ---------- */
const years=[];for(let y=Y;y>=Y-5;y--)years.push(y);
const ySel=id=>`<select id="${id}">${years.map(y=>`<option>${y}</option>`).join('')}</select>`;
const MODES={
  fecha:{t:'Fecha',ui:()=>`<label>Fecha<input type="date" id="f1" value="${iso(now)}"></label>`,r:()=>{const v=$('#f1').value;return[v,v,v?fmtD(v):'']}},
  mes:{t:'Mes',ui:()=>`<label>Mes<input type="month" id="f1" value="${Y}-${pad(M+1)}"></label>`,r:()=>{const[y,m]=$('#f1').value.split('-').map(Number);return[`${y}-${pad(m)}-01`,`${y}-${pad(m)}-${lastDay(y,m-1)}`,`${MESES[m-1]} ${y}`]}},
  cuatri:{t:'Cuatrimestre',ui:()=>`<label>Cuatrimestre<select id="f1"><option value="0">1° · Ene – Abr</option><option value="1">2° · May – Ago</option><option value="2">3° · Sep – Dic</option></select></label><label>Año${ySel('f2')}</label>`,
    init:()=>{$('#f1').value=String(Math.floor(M/4))},r:()=>{const c=+$('#f1').value,y=+$('#f2').value,a=c*4,b=a+3;return[`${y}-${pad(a+1)}-01`,`${y}-${pad(b+1)}-${lastDay(y,b)}`,`${c+1}° cuatrimestre ${y} (${MESES[a]} – ${MESES[b]})`]}},
  semestre:{t:'Semestre',ui:()=>`<label>Semestre<select id="f1"><option value="0">1° · Ene – Jun</option><option value="1">2° · Jul – Dic</option></select></label><label>Año${ySel('f2')}</label>`,
    init:()=>{$('#f1').value=String(M<6?0:1)},r:()=>{const s=+$('#f1').value,y=+$('#f2').value;return s?[`${y}-07-01`,`${y}-12-31`,`2° semestre ${y}`]:[`${y}-01-01`,`${y}-06-30`,`1° semestre ${y}`]}},
  anio:{t:'Año',ui:()=>`<label>Año${ySel('f1')}</label>`,r:()=>{const y=$('#f1').value;return[`${y}-01-01`,`${y}-12-31`,`Año ${y}`]}},
  custom:{t:'Personalizado',ui:()=>`<label>Desde<input type="date" id="f1" value="${Y}-${pad(M+1)}-01"></label><label>Hasta<input type="date" id="f2" value="${iso(now)}"></label>`,r:()=>{const a=$('#f1').value,b=$('#f2').value;return[a,b,a&&b?`${fmtD(a)} → ${fmtD(b)}`:'']}},
};
let mode='mes';
function drawModes(){$('#modes').innerHTML=Object.entries(MODES).map(([k,m])=>`<button class="mode ${k===mode?'on':''}" data-m="${k}">${m.t}</button>`).join('');
  $('#inputs').innerHTML=MODES[mode].ui()+`<div class="acts"><button class="btn ghost" id="csv">⬇ Excel</button><button class="btn ghost" id="pdf">🖨 PDF</button></div>`;MODES[mode].init&&MODES[mode].init();query();}
$('#modes').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;drawModes()};
$('#inputs').addEventListener('change',query);
$('#inputs').addEventListener('click',e=>{if(e.target.id==='csv')exportCSV();if(e.target.id==='pdf'){document.querySelectorAll('.inf').forEach(x=>x.classList.add('open'));setTimeout(()=>print(),100)}});

/* ---------- Datos ---------- */
let qT,curLabel='',curRange=['',''];
function query(){clearTimeout(qT);qT=setTimeout(load,120)}
async function fetchRange(d,h){const r=await fetch(`/api/informes?desde=${d}&hasta=${h}`,{headers:{'x-pin':PIN}});
  if(r.status===401){lock('PIN incorrecto');throw new Error('PIN')}const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j.informes||[]}
const toDate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function prevRange(d,h){
  if(mode==='mes'){const t=toDate(d);const p=new Date(t.getFullYear(),t.getMonth()-1,1);return[iso(p),iso(new Date(p.getFullYear(),p.getMonth()+1,0)),'mes anterior']}
  if(mode==='cuatri'){const t=toDate(d);const p=new Date(t.getFullYear(),t.getMonth()-4,1);return[iso(p),iso(new Date(p.getFullYear(),p.getMonth()+4,0)),'cuatrimestre anterior']}
  if(mode==='semestre'){const t=toDate(d);const p=new Date(t.getFullYear(),t.getMonth()-6,1);return[iso(p),iso(new Date(p.getFullYear(),p.getMonth()+6,0)),'semestre anterior']}
  if(mode==='anio'){const y=+d.slice(0,4)-1;return[`${y}-01-01`,`${y}-12-31`,'año anterior']}
  if(mode==='fecha'){const t=toDate(d);const a=new Date(t);a.setDate(a.getDate()-7);return[iso(a),iso(a),'semana anterior']}
  const a=toDate(d),b=toDate(h),days=Math.round((b-a)/864e5)+1;const pb=new Date(a);pb.setDate(pb.getDate()-1);const pa=new Date(pb);pa.setDate(pa.getDate()-days+1);return[iso(pa),iso(pb),'período anterior'];
}
let PREV=[],prevLabel='';
async function load(){
  const[d,h,label]=MODES[mode].r();if(!d||!h)return;
  if(d>h){$('#range').textContent='La fecha "desde" es posterior a "hasta"';return}
  curLabel=label;curRange=[d,h];$('#range').textContent='📅 '+label;
  const[pd,ph,pl]=prevRange(d,h);prevLabel=pl;
  $('#out').classList.add('load');
  try{[DATA,PREV]=await Promise.all([fetchRange(d,h),fetchRange(pd,ph).catch(()=>[])]);render();}
  catch(e){if(e.message!=='PIN')$('#out').innerHTML=`<div class="card empty">No se pudieron cargar los informes.<br><small>${esc(e.message)}</small></div>`}
  finally{$('#out').classList.remove('load')}
}
const effColor=p=>p>=90?'var(--ok)':p>=75?'var(--late)':'var(--red)';
const effTxt=p=>p>=90?'🟢 Excelente':p>=75?'🟡 Bueno':'🔴 Por mejorar';
const ATTL={adultos:'Adultos / Miembros',servidores:'Servidores',ninos:'Niños Arca de Noé',teens:'Teens',nuevos:'Invitados / Nuevos'};
const ATTC={adultos:'#3987e5',servidores:'#d95926',ninos:'#199e70',teens:'#c98500',nuevos:'#d55181'};
const BLOQ=['Montaje y Mantenimiento','Tiempo de Oración','Sound Check y Arca de Noé','Koinonia y Posiciones','Apertura y Alabanza','Prédica y Ministración','Diezmos, Invitados y Anuncios','Desmontaje y Cierre'];
const nf=n=>Math.round(n).toLocaleString('es-CL');

function stats(arr){
  const n=arr.length;let ok=0,late=0,na=0,delay=0,att=0;const attB={};const blocks={},tasks={},dirs={};
  arr.forEach(r=>{ok+=r.a_tiempo;late+=r.tarde;na+=r.na;delay+=r.atraso_min;att+=r.asistencia_total;
    Object.keys(ATTL).forEach(k=>attB[k]=(attB[k]||0)+(+(r.asistencia||{})[k]||0));
    (r.tareas||[]).forEach(t=>{if(t.estado!=='ok'&&t.estado!=='late')return;
      const B=blocks[t.bloque]=blocks[t.bloque]||{ok:0,ev:0,min:0};B.ev++;if(t.estado==='ok')B.ok++;else B.min+=t.atraso||0;
      const T=tasks[t.tarea]=tasks[t.tarea]||{ev:0,late:0,min:0,bloque:t.bloque};T.ev++;if(t.estado==='late'){T.late++;T.min+=t.atraso||0}});
    const D=dirs[r.director]=dirs[r.director]||{n:0,ok:0,ev:0,att:0,min:0};D.n++;D.ok+=r.a_tiempo;D.ev+=r.a_tiempo+r.tarde;D.att+=r.asistencia_total;D.min+=r.atraso_min;});
  const ev=ok+late;
  return{n,ok,late,na,delay,att,attB,blocks,tasks,dirs,ev,eff:ev?ok/ev*100:0,attAvg:n?att/n:0,delayAvg:n?delay/n:0,newPct:att?(attB.nuevos||0)/att*100:0};
}
function delta(cur,prev,{unit='',good='up',pp=false,dec=0}={}){
  if(!PREV.length)return `<small class="dl neutral">Sin datos del ${prevLabel}</small>`;
  const d=pp?cur-prev:(prev?((cur-prev)/prev*100):null);
  if(d===null)return `<small class="dl neutral">—</small>`;
  const r=Math.abs(d)<0.5?0:d;const better=good==='up'?r>0:r<0;
  const cls=r===0?'neutral':better?'good':'bad';const ar=r===0?'●':r>0?'▲':'▼';
  return `<small class="dl ${cls}">${ar} ${Math.abs(r).toFixed(dec)}${pp?' pts':'%'} vs ${prevLabel}</small>`;
}

/* --- gráfico de línea (eficiencia) y barras (asistencia), un eje cada uno --- */
function groupSeries(){
  const chron=[...DATA].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(chron.length<=16)return chron.map(r=>({k:r.fecha,lab:`${r.fecha.slice(8)}/${r.fecha.slice(5,7)}`,tip:fmtD(r.fecha)+' · '+r.director,eff:r.eficiencia,att:r.asistencia_total,n:1}));
  const g={};chron.forEach(r=>{const k=r.fecha.slice(0,7);const G=g[k]=g[k]||{ok:0,ev:0,att:0,n:0};G.ok+=r.a_tiempo;G.ev+=r.a_tiempo+r.tarde;G.att+=r.asistencia_total;G.n++});
  return Object.entries(g).map(([k,G])=>({k,lab:MESES[+k.slice(5)-1].slice(0,3),tip:`${MESES[+k.slice(5)-1]} ${k.slice(0,4)} · ${G.n} servicios`,eff:G.ev?Math.round(G.ok/G.ev*100):0,att:Math.round(G.att/G.n),n:G.n}));
}
const CW=()=>Math.max(280,(document.querySelector('#out').clientWidth||360)-34);
function lineChart(S){
  const W=Math.max(CW(),S.length*52),H=190,pl=34,pr=22,pt=14,pb=28,iw=W-pl-pr,ih=H-pt-pb;
  const x=i=>pl+(S.length===1?iw/2:i*iw/(S.length-1)),y=v=>pt+ih-(v/100)*ih;
  const grid=[0,25,50,75,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${pl-8}" y="${y(v)+4}" class="ax" text-anchor="end">${v}</text>`).join('');
  const refs=[[90,'var(--ok)','Meta 90'],[75,'var(--late)','75']].map(([v,c,t])=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-dasharray="4 4" opacity=".55"/><text x="${pl+6}" y="${y(v)+13}" class="ax" text-anchor="start" style="fill:${c}">${t}</text>`).join('');
  const path=S.map((s,i)=>`${i?'L':'M'}${x(i)},${y(s.eff)}`).join(' ');
  const area=`${path} L${x(S.length-1)},${y(0)} L${x(0)},${y(0)} Z`;
  const pts=S.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.eff)}" r="5" fill="${effColor(s.eff)}" stroke="#121a2b" stroke-width="2"/><rect x="${x(i)-20}" y="${pt}" width="40" height="${ih}" fill="transparent" data-tip="<b>${esc(s.tip)}</b><br>Eficiencia: <b>${s.eff}%</b> ${effTxt(s.eff)}"/>`).join('');
  const labs=S.map((s,i)=>(S.length<=12||i%Math.ceil(S.length/12)===0)?`<text x="${x(i)}" y="${H-8}" class="ax" text-anchor="middle">${s.lab}</text>`:'').join('');
  return `<svg width="${W}" height="${H}" role="img" aria-label="Eficiencia por servicio"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3a0" stop-opacity=".25"/><stop offset="1" stop-color="#22d3a0" stop-opacity="0"/></linearGradient></defs>${grid}${refs}<path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="#22d3a0" stroke-width="2"/>${pts}${labs}</svg>`;
}
function barChart(S){
  const W=Math.max(CW(),S.length*52),H=190,pl=40,pr=14,pt=18,pb=28,iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(...S.map(s=>s.att),1),nice=Math.ceil(max/50)*50||50,step=iw/S.length,bw=Math.min(28,step-8);
  const y=v=>pt+ih-(v/nice)*ih;const avg=S.reduce((a,s)=>a+s.att,0)/S.length;
  const grid=[0,.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(nice*f)}" y2="${y(nice*f)}" stroke="rgba(255,255,255,.07)"/><text x="${pl-8}" y="${y(nice*f)+4}" class="ax" text-anchor="end">${nf(nice*f)}</text>`).join('');
  const bars=S.map((s,i)=>{const cx=pl+i*step+step/2,h=Math.max(2,ih*s.att/nice);return `<path d="M${cx-bw/2},${y(0)} V${y(0)-h+4} q0,-4 4,-4 h${bw-8} q4,0 4,4 V${y(0)} Z" fill="#f2c46d"/><rect x="${cx-step/2}" y="${pt}" width="${step}" height="${ih}" fill="transparent" data-tip="<b>${esc(s.tip)}</b><br>Asistencia: <b>${nf(s.att)}</b>${s.n>1?' (promedio)':''}"/>${(S.length<=12||i%Math.ceil(S.length/12)===0)?`<text x="${cx}" y="${H-8}" class="ax" text-anchor="middle">${s.lab}</text>`:''}`}).join('');
  const av=`<line x1="${pl}" x2="${W-pr}" y1="${y(avg)}" y2="${y(avg)}" stroke="#f1f4fb" stroke-dasharray="3 4" opacity=".5"/><text x="${W-pr}" y="${y(avg)-5}" class="ax" text-anchor="end">Prom. ${nf(avg)}</text>`;
  return `<svg width="${W}" height="${H}" role="img" aria-label="Asistencia por servicio">${grid}${bars}${av}</svg>`;
}

function render(){
  const s=stats(DATA),p=stats(PREV);
  if(!s.n){$('#out').innerHTML=`<div class="card empty">No hay informes en este período.</div>`;return}
  const effR=Math.round(s.eff),pL=100-effR;
  let h=`<div class="card hero"><div class="hl">EFICIENCIA DEL SERVICIO · ${esc(curLabel).toUpperCase()}</div>
    <div class="hrow"><div class="big" style="color:${effColor(effR)}">${effR}<span>%</span></div>
    <div class="hs"><b>${effTxt(effR)}</b>${delta(s.eff,p.eff,{pp:true})}<div class="split"><i style="width:${effR}%;background:var(--ok)"></i><i style="width:${pL}%;background:var(--late)"></i></div>
    <div class="leg"><span><i style="background:var(--ok)"></i>A tiempo ${effR}% · ${s.ok}</span><span><i style="background:var(--late)"></i>Fuera de tiempo ${pL}% · ${s.late}</span><span>N/A ${s.na}</span></div></div></div></div>`;

  h+=`<div class="kpis">
    <div class="kpi"><span>Servicios reportados</span><b>${s.n}</b>${delta(s.n,p.n)}</div>
    <div class="kpi"><span>Asistencia promedio</span><b>${nf(s.attAvg)}</b>${delta(s.attAvg,p.attAvg)}<small class="sub">Total ${nf(s.att)} personas</small></div>
    <div class="kpi"><span>Atraso promedio</span><b>${nf(s.delayAvg)}<em> min</em></b>${delta(s.delayAvg,p.delayAvg,{good:'down'})}<small class="sub">Acumulado ${nf(s.delay)} min</small></div>
    <div class="kpi"><span>Invitados / Nuevos</span><b>${nf(s.attB.nuevos||0)}</b>${delta(s.attB.nuevos||0,p.attB.nuevos||0)}<small class="sub">${s.newPct.toFixed(1)}% de la asistencia</small></div></div>`;

  const S=groupSeries();const agg=S.length&&S[0].n>1||DATA.length>16;
  if(S.length>1){
    h+=`<div class="card"><h2>Eficiencia ${agg?'por mes':'por servicio'}</h2><p class="cap">% de tareas cumplidas a tiempo. Líneas guía en 90% (meta) y 75%.</p><div class="chart">${lineChart(S)}</div></div>`;
    h+=`<div class="card"><h2>Asistencia ${agg?'promedio por mes':'por servicio'}</h2><p class="cap">Personas por servicio y promedio del período.</p><div class="chart">${barChart(S)}</div></div>`;
  }

  const keys=Object.keys(ATTL);
  h+=`<div class="card"><h2>Composición de la asistencia</h2><p class="cap">${nf(s.att)} asistentes en ${s.n} servicio${s.n>1?'s':''}</p>
    <div class="stack">${keys.map(k=>{const v=s.attB[k]||0,pc=s.att?v/s.att*100:0;return pc?`<i style="width:${pc}%;background:${ATTC[k]}" data-tip="<b>${ATTL[k]}</b><br>${nf(v)} · ${pc.toFixed(1)}%"></i>`:''}).join('')}</div>
    ${keys.map(k=>{const v=s.attB[k]||0,pv=p.attB[k]||0,pc=s.att?v/s.att*100:0;return `<div class="row"><span class="sw" style="background:${ATTC[k]}"></span><span class="n">${ATTL[k]}<span class="sub">Prom. ${nf(v/s.n)} por servicio</span></span><span class="v">${nf(v)} <span class="pc">${pc.toFixed(1)}%</span>${PREV.length&&pv?`<span class="sub ${v>=pv?'g':'r'}" style="text-align:right">${v>=pv?'▲':'▼'} ${Math.abs((v-pv)/pv*100).toFixed(0)}%</span>`:''}</span></div>`}).join('')}</div>`;

  const bl=BLOQ.filter(b=>s.blocks[b]).map(b=>[b,s.blocks[b]]);
  h+=`<div class="card"><h2>Puntualidad por bloque del programa</h2><p class="cap">% de tareas a tiempo en cada bloque, en orden del programa.</p>${bl.map(([b,v])=>{const pc=Math.round(v.ok/v.ev*100);return `<div class="row" style="display:block" data-tip="<b>${esc(b)}</b><br>${v.ok} de ${v.ev} a tiempo · ${v.min} min de atraso"><div style="display:flex;justify-content:space-between;gap:8px"><span class="n">${esc(b)}</span><span class="v" style="color:${effColor(pc)}">${pc}%</span></div><div class="bar"><i style="width:${pc}%;background:${effColor(pc)}"></i></div></div>`}).join('')}</div>`;

  const topT=Object.entries(s.tasks).filter(([,v])=>v.late).sort((a,b)=>b[1].late-a[1].late||b[1].min-a[1].min).slice(0,8);
  h+=`<div class="card"><h2>Tareas con más atrasos</h2>${topT.length?topT.map(([k,v],i)=>`<div class="row"><span class="rk">${i+1}</span><span class="n">${esc(k)}<span class="sub">${esc(v.bloque||'')} · ${v.late} de ${v.ev} veces tarde · prom. ${Math.round(v.min/v.late)} min</span></span><span class="v" style="color:var(--late)">${Math.round(v.late/v.ev*100)}%</span></div>`).join(''):`<div class="empty" style="padding:10px">🎉 Sin atrasos en este período</div>`}</div>`;

  if(s.n>1){const best=[...DATA].sort((a,b)=>b.eficiencia-a.eficiencia||a.atraso_min-b.atraso_min)[0],most=[...DATA].sort((a,b)=>b.asistencia_total-a.asistencia_total)[0],worst=[...DATA].sort((a,b)=>b.atraso_min-a.atraso_min)[0];
    h+=`<div class="card"><h2>Destacados del período</h2><div class="hi">
      <div><span>🏆 Mejor eficiencia</span><b>${best.eficiencia}%</b><small>${fmtD(best.fecha)} · ${esc(best.director)}</small></div>
      <div><span>👥 Mayor asistencia</span><b>${nf(most.asistencia_total)}</b><small>${fmtD(most.fecha)} · ${esc(most.director)}</small></div>
      <div><span>⏱ Más minutos de atraso</span><b>${worst.atraso_min} min</b><small>${fmtD(worst.fecha)} · ${esc(worst.director)}</small></div></div></div>`;}

  h+=`<div class="card"><h2>Por Director de Culto</h2><div class="tbl"><table><thead><tr><th>Director</th><th>Servicios</th><th>Eficiencia</th><th>Asist. prom.</th><th>Atraso prom.</th></tr></thead><tbody>${Object.entries(s.dirs).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>{const pc=v.ev?Math.round(v.ok/v.ev*100):0;return `<tr><td>${esc(k)}</td><td>${v.n}</td><td style="color:${effColor(pc)};font-weight:800">${pc}%</td><td>${nf(v.att/v.n)}</td><td>${nf(v.min/v.n)} min</td></tr>`}).join('')}</tbody></table></div></div>`;

  h+=`<div class="card"><h2>Informes (${s.n})</h2>${DATA.map(r=>{const lt=(r.tareas||[]).filter(t=>t.estado==='late');
    return `<div class="inf" data-id="${r.id}"><div class="h"><div class="d"><b>${fmtD(r.fecha)}</b><span>${esc(r.director)} · 👥 ${r.asistencia_total} · ⏱ ${r.atraso_min} min</span></div><span class="badge" style="color:${effColor(r.eficiencia)}">${r.eficiencia}%</span></div>
    <div class="det">✅ ${r.a_tiempo} a tiempo · ⚠️ ${r.tarde} fuera de tiempo · ➖ ${r.na} N/A
      ${lt.length?`<h4>ATRASOS</h4>${lt.map(t=>`• <b>${esc(t.tarea)}</b> — prog. ${esc(t.programado)}, real ${esc(t.hora_real||'')} (+${t.atraso} min)${t.motivo?`<br>&nbsp;&nbsp;💬 <i>${esc(t.motivo)}</i>`:''}`).join('<br>')}`:''}
      <h4>ASISTENCIA</h4>${Object.keys(ATTL).map(k=>`${ATTL[k]}: <b>${(r.asistencia||{})[k]??0}</b>`).join(' · ')}
      <h4>OBSERVACIÓN FINAL</h4>${esc(r.observacion)||'—'}
      <br><button class="del" data-del="${r.id}" data-f="${r.fecha}" data-n="${esc(r.director)}">Eliminar informe</button></div></div>`}).join('')}</div>`;
  $('#out').innerHTML=h;
}
/* tooltip */
const tip=document.createElement('div');tip.className='tip';document.body.appendChild(tip);
function showTip(e){const t=e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}tip.innerHTML=t.dataset.tip;tip.style.opacity=1;
  const p=e.touches?e.touches[0]:e;const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,Math.max(8,p.clientX-w/2))+'px';tip.style.top=(p.clientY-tip.offsetHeight-14)+'px'}
document.addEventListener('mousemove',showTip);document.addEventListener('touchstart',showTip,{passive:true});document.addEventListener('scroll',()=>tip.style.opacity=0,{passive:true});
$('#out').addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');if(d){e.stopPropagation();delId=d.dataset.del;$('#mTxt').textContent=`${fmtD(d.dataset.f)} · ${d.dataset.n}`;$('#modal').classList.add('show');return}
  const c=e.target.closest('.inf');if(c)c.classList.toggle('open');});
$('#mNo').onclick=()=>$('#modal').classList.remove('show');
$('#mYes').onclick=async()=>{$('#modal').classList.remove('show');
  try{const r=await fetch(`/api/informes?id=${delId}`,{method:'DELETE',headers:{'x-pin':PIN}});if(!r.ok)throw 0;toast('Informe eliminado');load()}catch(e){toast('No se pudo eliminar',true)}};

/* ---------- Exportar ---------- */
function exportCSV(){
  if(!DATA.length){toast('No hay informes para exportar',true);return}
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['Fecha','Director de Culto','Eficiencia %','A tiempo','Fuera de tiempo','N/A','Atraso (min)','Asistencia total',...Object.values(ATTL),'Tareas atrasadas','Observación final'];
  const rows=DATA.map(r=>[r.fecha,r.director,r.eficiencia,r.a_tiempo,r.tarde,r.na,r.atraso_min,r.asistencia_total,...Object.keys(ATTL).map(k=>(r.asistencia||{})[k]??0),
    (r.tareas||[]).filter(t=>t.estado==='late').map(t=>`${t.tarea} (+${t.atraso} min${t.motivo?': '+t.motivo:''})`).join(' | '),r.observacion]);
  const csv='﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`informes-ING_${curRange[0]}_a_${curRange[1]}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- PIN ---------- */
function lock(msg){$('#main').style.display='none';$('#lock').style.display='';$('#pinErr').textContent=msg||'';try{localStorage.removeItem(PKEY)}catch(e){}PIN=''}
async function tryPin(p){
  $('#pinErr').textContent='';
  const r=await fetch('/api/informes?desde=2999-01-01&hasta=2999-01-01',{headers:{'x-pin':p}}).catch(()=>null);
  if(!r){$('#pinErr').textContent='Sin conexión';return}
  if(r.status===401){$('#pinErr').textContent='PIN incorrecto';return}
  if(!r.ok){$('#pinErr').textContent='La base de datos aún no está conectada';return}
  PIN=p;try{localStorage.setItem(PKEY,p)}catch(e){}
  $('#lock').style.display='none';$('#main').style.display='';drawModes();
}
$('#pinGo').onclick=()=>tryPin($('#pin').value.trim());
$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')tryPin($('#pin').value.trim())});
if(PIN)tryPin(PIN);
</script>
